<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<title>Curso</title>

<style type="text/css">
body, html { background: #000000; font-family: Verdana, Arial, Helvetica, sans-serif; min-height: 100%; height: 100%; margin: 0; overflow: hidden; text-align: center; }
#objFlash { margin: 0 auto 0 auto; outline: none; position: relative; }
</style>

<script src="js/APIWrapper.js" type="text/javascript"></script>
<script src="js/swfobject.js" type="text/javascript"></script>

<script type="text/javascript">
//<![CDATA[

// *** Inicializar los variables SCORM que usamos ***
var lessonStatus = "";
var scoreRaw = 0;
var lessonLocation = "0";
var suspendData = "";
var studentName = "";
var scoreMax = 0;


// *** Conectar a SCORM y cargar variables ***
function conectarSCORM()
{
	var iniciar = doLMSInitialize();
	jsTrace("SCORM iniciar: " + iniciar);
	
	try {		var objeto = thisMovie("objFlash"); }
	catch ( e ) {var objeto = thisMovie("objFlash"); }
	
	if (iniciar == "true") 
	{
		// *** Cargar variables SCORM que usamos ***
		lessonStatus = String(doLMSGetValue("cmi.core.lesson_status"));
		scoreRaw = Number(doLMSGetValue("cmi.core.score.raw"));
		lessonLocation = String(doLMSGetValue("cmi.core.lesson_location"));
		
		suspendData = String(doLMSGetValue("cmi.suspend_data"));
		suspendData = suspendData.split("||").join("\"");
		suspendData = suspendData.split("%%").join("||");
		
		studentName = String(doLMSGetValue("cmi.core.student_name"));
		
		jsTrace("lessonStatus: " + lessonStatus + ", scoreRaw: " + scoreRaw + ", lessonLocation: " + lessonLocation + ", suspendData: " + suspendData + ", studentName: " + studentName);
		
		// *** Despues iniciar, pongamos status a "incomplete" ***
		doLMSSetValue("cmi.core.lesson_status", "incomplete");
		
		// *** Asegurar que el puntaje es un porcentaje ***
		doLMSSetValue("cmi.core.score.max", 100);
		doLMSSetValue("cmi.core.score.min", 0);
		
		// *** Guardar en el servidor ***
		doLMSCommit();
		
		// *** Enviar variables que Flash necesita ***
		
		//thisMovie("objFlash").sendToActionScript("lessonStatus", lessonStatus);
		//thisMovie("objFlash").sendToActionScript("scoreRaw", scoreRaw);
		//thisMovie("objFlash").sendToActionScript("lessonLocation", lessonLocation);
		thisMovie("objFlash").sendToActionScript("suspendData", suspendData);
		//thisMovie("objFlash").sendToActionScript("studentName", studentName);
	}
	else
	{
		jsTrace("SCORM no está connectado!");
	}
	// *** Enviar a Flash que estamos listos para abrir el curso si estamos conectado o no ***
	thisMovie("objFlash").sendToActionScript("scormConectado", String(iniciar));	
}

function thisMovie(movieName)
{
	if (navigator.appName.indexOf("Microsoft") != -1)
		return window[movieName];
	else
		return document[movieName];
}
// *** Para que Flash sabe que estamos comnnectado a JavaScript o no ***
function pingJS()
{
	return true;
}


// *** Guardar variables SCORM que usamos ***
function guardarDatos(scoreMaxArg, lessonStatusArg, scoreRawArg, lessonLocationArg, suspendDataArg)
{
	// *** Selecciona los variables que usamos ***
	
	// Posiblemente envía "cmi.core.score.min" y "cmi.core.score.max" ***
	if (scoreMax == 0 && scoreMaxArg > 0)
	{
		scoreMax = Number(scoreMaxArg);
		//doLMSSetValue("cmi.core.score.min", 0);
		//doLMSSetValue("cmi.core.score.max", scoreMax);
	}
	
	// Siempre envía "cmi.core.lesson_status" ***
	jsTrace("lessonStatusArg: " + lessonStatusArg);
	lessonStatus = String(lessonStatusArg);
	if (lessonStatus == "")
		lessonStatus = "incomplete";
		
	doLMSSetValue("cmi.core.lesson_status", lessonStatus);
	
	// Siempre envía "cmi.core.score.raw" ***
	jsTrace("scoreRawArg: " + scoreRawArg);
	scoreRaw = Number(scoreRawArg);
	if (scoreRaw == "" || isNaN(scoreRaw)) scoreRaw = 0;
	if (scoreRaw < 0) scoreRaw = 0;
	if (scoreRaw > 100) scoreRaw = 100;
	doLMSSetValue("cmi.core.score.raw", String(scoreRaw));
	
	// Posiblemente envía "cmi.core.lesson_location" ***
	lessonLocation = String(lessonLocationArg);
	if (lessonLocation != "")
		doLMSSetValue("cmi.core.lesson_location", lessonLocation);
	
	// Posiblemente envía "cmi.suspend_data" ***
	suspendData = String(suspendDataArg);
	if (suspendData != "")
	{
		suspendData = suspendData.split("||").join("%%");
		suspendData = suspendData.split("\"").join("||");
		doLMSSetValue("cmi.suspend_data", suspendData);
	}
	
	// *** Guardar en el servidor ***
	doLMSCommit();
	
	jsTrace("scoreMax: " + scoreMax + ", lessonStatus: " + lessonStatus + ", scoreRaw: " + scoreRaw + ", lessonLocation: " + lessonLocation + ", suspendData: " + suspendData);
}


// *** Para KME que ahora no puede guardar suspend_data en el mismo timepo ***
function guardarComplete()
{
	doLMSSetValue("cmi.core.lesson_status", "completed");
	doLMSCommit();
	jsTrace("JS - cmi.core.lesson_status : completed");
}


// *** Asegurar que manejamos ventana cerrar correctamente ***
var unloaded = false;
function cerrar()
{
	if(!unloaded)
	{
		jsTrace("window cerrar");
		doLMSFinish();
		unloaded = true;
	}
}
window.onbeforeunload = cerrar;
window.onunload = cerrar;


// *** Para hacer depuracion en Firebug o otra herramienta. ***
function jsTrace(str)
{
	// *** Se puede deshablitar todo el contenido de este function para producción ***
	if (this.console && typeof console.log != "undefined")
	{
		console.log(str);
	}
	else
	{
		// *** Este liea es solo para depuracion no para producción. Con esta que se puede mirar en IE8 ***
		//alert(str);
	}
}


// *** swfobject para cargar Flash ***
var flashvars = {};
var params = {};
params.bgcolor = "#000000";
params.allowscriptaccess = "always"; 
var attributes = {};
attributes.id = "objFlash";
attributes.name = "objFlash";
var paramsURL = "";
var urlMovie = "Main.swf" + paramsURL;
swfobject.embedSWF(urlMovie, "objFlash", "100%", "100%", "10", false, flashvars, params, attributes);

//]]>
</script>

</head>
<body>
<div id="objFlash">Necesita Flash Player 10 o mas.</div>
</body>
</html>
