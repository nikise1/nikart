<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>Ciudad Helm</title>
<link rel="stylesheet" href="css/reset.css" type="text/css" media="screen" />
<script src="js/SCORMlibHTM.js" type="text/javascript" language="JavaScript"></script>
<script src="js/SCORMLibFlash.js" type="text/javascript" language="JavaScript"></script>
<script src="js/swfobject.js" type="text/javascript"></script>
<script type="text/javascript" language="JavaScript">

	function thisMovie(movieName) {
		if (navigator.appName.indexOf("Microsoft") != -1) {
			return window[movieName];
		} else {
			return document[movieName];
		}
	}
	
	function guardarDatos(porcentaje1, data2, terminado3) {
		//alert("guardarDatos(), porcentaje: " + porcentaje1 + ", data: " + data2 + ", terminado: " + terminado3);
		
		SCOSetValue("cmi.core.score.raw", Number(porcentaje1));
				
		var newString = data2.split("\"");
		newString = newString.join("\\" + "\"");
		SCOSetValue("cmi.suspend_data", newString);
		
		if (terminado3 == "si") {
			SCOSetValue("cmi.core.lesson_status","complete");
		} else {
			SCOSetValue("cmi.core.lesson_status","incomplete");
		}
		
		SCOCommit("cmi.core.score.raw");
		SCOCommit("cmi.suspend_data");
		SCOCommit("cmi.core.lesson_status");
	}

	function onCerrarJuego(porcentaje1, data2, terminado3) {
		Cerrando();
	}
	
	function Cerrando(){
		parent.close();
    }
    
	function SwfListo() {
		var puntaje = 0;
		var dataStr = "";
		var lessonStatus = "";
		
		var iniLMS = SCOInitialize();

		if (iniLMS == "true") {
			puntaje = SCOGetValue("cmi.core.score.raw");
			dataStr = SCOGetValue("cmi.suspend_data");
			lessonStatus = SCOGetValue("cmi.core.lesson_status");
			
			SCOSetValue("cmi.core.score.min", 0);
			SCOSetValue("cmi.core.score.max", 100);
			SCOSetValue("cmi.core.score.raw", Number(puntaje));
			SCOSetValue("cmi.core.lesson_status",lessonStatus);
			
			SCOCommit("cmi.core.score.min");
			SCOCommit("cmi.core.score.max");
			SCOCommit("cmi.core.score.raw");
			SCOCommit("cmi.core.lesson_status");
		}
		
		try {		var objeto = thisMovie("objFlash"); }
		catch ( e ) {var objeto = thisMovie("objFlash"); }
		
		thisMovie("objFlash").sendToActionScript("puntaje", puntaje);
		thisMovie("objFlash").sendToActionScript("dataStr", dataStr);
		
		//alert("SwfListo(), porcentaje: " + puntaje + ", data: " + dataStr + ", lessonStatus: " + lessonStatus);
	}
	
	
	// *** swfobject ***
	var flashvars = {};
	var params = {};
	params.bgcolor = "#FFFFFF";
	params.allowscriptaccess = "always"; 
	var attributes = {};
	attributes.id = "objFlash";
	attributes.name = "objFlash";
	
	var paramsURL = "";
	var urlMovie = "Main.swf" + paramsURL;
	
	swfobject.embedSWF(urlMovie, "swf_container", "100%", "100%", "10.0.0", false, flashvars, params, attributes);
	
</script>
</head>
<body onunload="Cerrando();" onresize="redimensionarCurso();">
	<div id="swf_container">
		<br /> 
		No tiene Flash Player.<br /> 
		<br /> 
		<a href="http://www.adobe.com/go/getflashplayer" target="_blank">Descarga de Adobe</a><br /> 
		<br /> 
		<a href="http://www.adobe.com/go/getflashplayer" target="_blank"><img src="http://www.adobe.com/macromedia/style_guide/images/160x41_Get_Flash_Player.jpg" width="160" height="41" border="0" /></a> <br /> 
		<br />
	</div>
</body>
</html>
