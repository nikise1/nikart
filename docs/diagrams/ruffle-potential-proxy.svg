<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Option A  same-origin reverse proxy</title>
  <desc id="desc">Keep local main.swf in Ruffle. Point staticfilesstr at /static and rewrite that prefix to the S3 bucket so the browser never talks HTTP to static.nikart.co.uk.</desc>
  <rect width="1100" height="560" fill="#0b0b0b"/>
  <text x="40" y="48" fill="#95cf89" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Option A  Same-origin reverse proxy</text>
  <text x="40" y="74" fill="#c8c8c8" font-family="Helvetica, Arial, sans-serif" font-size="13">Keep local main.swf. staticfilesstr becomes /static. Next.js fetches S3 server-side (same pattern as /games and /video_h264 today).</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#95cf89"/>
    </marker>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13">
    <rect x="40" y="120" width="200" height="80" rx="8" fill="#1a1a1a" stroke="#95cf89" stroke-width="2"/>
    <text x="140" y="152" text-anchor="middle" fill="#ffffff">Ruffle /fl</text>
    <text x="140" y="174" text-anchor="middle" fill="#c8c8c8">local main.swf</text>

    <rect x="320" y="120" width="240" height="80" rx="8" fill="#1a1a1a" stroke="#95cf89" stroke-width="2"/>
    <text x="440" y="148" text-anchor="middle" fill="#ffffff">flashVar</text>
    <text x="440" y="170" text-anchor="middle" fill="#95cf89">staticfilesstr = /static</text>
    <text x="440" y="188" text-anchor="middle" fill="#888888" font-size="11">or ../static as in development</text>

    <rect x="640" y="120" width="200" height="80" rx="8" fill="#142414" stroke="#95cf89" stroke-width="2"/>
    <text x="740" y="148" text-anchor="middle" fill="#ffffff">Next rewrite</text>
    <text x="740" y="170" text-anchor="middle" fill="#c8c8c8">/static/:path*</text>
    <text x="740" y="188" text-anchor="middle" fill="#888888" font-size="11">next.config.ts</text>

    <rect x="920" y="120" width="140" height="80" rx="8" fill="#1a1a1a" stroke="#e0b060" stroke-width="2"/>
    <text x="990" y="152" text-anchor="middle" fill="#ffffff">S3</text>
    <text x="990" y="174" text-anchor="middle" fill="#e0b060" font-size="11">HTTP, server-side</text>
  </g>

  <g stroke="#95cf89" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="240" y1="160" x2="320" y2="160"/>
    <line x1="560" y1="160" x2="640" y2="160"/>
    <line x1="840" y1="160" x2="920" y2="160"/>
  </g>

  <rect x="40" y="240" width="1020" height="180" rx="10" fill="#121812" stroke="#3d6b3d"/>
  <text x="60" y="274" fill="#95cf89" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Fixes</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c8c8c8">
    <text x="60" y="308">HTTPS page never talks to http://static.nikart.co.uk from the browser (no mixed content).</text>
    <text x="60" y="336">SWF NetStream / popWin URLs stay on nikart origin: /static/games/whiplash/index.html</text>
    <text x="60" y="364">Matches existing HTML5 rewrites for /video_h264, /video_webm, /games.</text>
    <text x="60" y="392">flashVars shape unchanged  only the base string changes.</text>
  </g>

  <rect x="40" y="440" width="1020" height="90" rx="10" fill="#1a1212" stroke="#6b3d3d"/>
  <text x="60" y="474" fill="#e07a7a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Not enough alone</text>
  <text x="60" y="504" fill="#c8c8c8" font-family="Helvetica, Arial, sans-serif" font-size="14">Proxied index.html pages still call swfobject.embedSWF. Without Option B or C they still say You need Flash Player.</text>
</svg>
