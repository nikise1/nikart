name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www-root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: www-root/package.json
          cache: npm
          cache-dependency-path: www-root/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
